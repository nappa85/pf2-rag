<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathfinder 2e IT - Selezione Classe & Livello</title>
<style>
:root {
  --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460;
  --accent: #e94560; --accent2: #533483; --text: #eee; --dim: #8899aa;
  --spell: #4fc3f7; --talent: #81c784; --feature: #ffb74d; --level: #ce93d8;
  --focus: #ff8a65;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
.header { background: var(--surface); padding: 18px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; border-bottom: 2px solid var(--accent); }
.header h1 { font-size: 1.3rem; color: var(--accent); white-space: nowrap; }
.controls { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.control-group { display: flex; flex-direction: column; gap: 4px; }
.control-group label { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
select { background: var(--surface2); color: var(--text); border: 1px solid var(--dim); border-radius: 6px; padding: 8px 12px; font-size: 1rem; cursor: pointer; }
select:focus { outline: 2px solid var(--accent); }
.level-display { font-size: 2rem; font-weight: 700; color: var(--level); min-width: 50px; text-align: center; }
input[type=range] { width: 200px; accent-color: var(--accent); }
.tabs { display: flex; gap: 0; background: var(--surface); padding: 0 24px; border-bottom: 1px solid var(--surface2); }
.tab { padding: 10px 20px; cursor: pointer; font-size: 0.9rem; border-bottom: 3px solid transparent; color: var(--dim); transition: all 0.15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.main { padding: 16px 24px; max-width: 1400px; margin: 0 auto; }
.card { background: var(--surface); border-radius: 12px; padding: 16px; border: 1px solid var(--surface2); margin-bottom: 16px; }
.card h2 { font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card h2 .icon { width: 20px; height: 20px; border-radius: 50%; display: inline-block; }
.group-header { font-size: 0.85rem; font-weight: 600; padding: 6px 10px; border-radius: 6px; margin: 10px 0 6px 0; }
.spell-group .group-header { background: rgba(79,195,247,0.15); color: var(--spell); }
.talent-group .group-header { background: rgba(129,199,132,0.15); color: var(--talent); }
.focus-group .group-header { background: rgba(255,138,101,0.15); color: var(--focus); }
.school-header { font-size: 0.8rem; font-weight: 600; padding: 4px 8px; border-radius: 4px; margin: 6px 0 4px 8px; color: var(--dim); border-left: 3px solid var(--dim); }
.spell-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-left: 8px; margin-bottom: 4px; }
.spell-chip { background: var(--surface2); padding: 3px 8px; border-radius: 4px; font-size: 0.78rem; border-left: 3px solid var(--spell); transition: background 0.15s; cursor: default; }
.spell-chip:hover { background: var(--accent2); }
.spell-chip.focus { border-left-color: var(--focus); }
.talent-chip { background: var(--surface2); padding: 3px 8px; border-radius: 4px; font-size: 0.78rem; border-left: 3px solid var(--talent); transition: background 0.15s; cursor: default; }
.talent-chip:hover { background: var(--accent2); }
.empty { color: var(--dim); font-style: italic; font-size: 0.85rem; padding: 8px; }
.summary-bar { display: flex; gap: 16px; padding: 10px 24px; background: var(--surface); border-top: 1px solid var(--surface2); }
.summary-stat { text-align: center; }
.summary-stat .num { font-size: 1.4rem; font-weight: 700; }
.summary-stat .lbl { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; }
.progression-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.progression-table th, .progression-table td { padding: 4px 8px; text-align: center; border-bottom: 1px solid var(--surface2); }
.progression-table th { color: var(--dim); font-size: 0.7rem; text-transform: uppercase; }
.progression-table td.available { color: var(--spell); font-weight: 700; }
.progression-table td.unavailable { color: var(--dim); }
.school-counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.school-badge { background: var(--surface2); padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
.pill.arcane { background: rgba(79,195,247,0.2); color: #4fc3f7; }
.pill.divine { background: rgba(255,183,77,0.2); color: #ffb74d; }
.pill.occult { background: rgba(206,147,216,0.2); color: #ce93d8; }
.pill.primal { background: rgba(129,199,132,0.2); color: #81c784; }
</style>
</head>
<body>
<div class="header">
  <h1>Pathfinder 2e IT</h1>
  <div class="controls">
    <div class="control-group">
      <label>Classe</label>
      <select id="classSelect"></select>
    </div>
    <div class="control-group">
      <label>Livello Personaggio</label>
      <div style="display:flex;align-items:center;gap:10px;">
        <input type="range" id="levelSlider" min="1" max="20" value="1">
        <span class="level-display" id="levelDisplay">1</span>
      </div>
    </div>
  </div>
</div>
<div class="tabs" id="tabs">
  <div class="tab active" data-tab="spells">Incantesimi per Livello</div>
  <div class="tab" data-tab="byschool">Incantesimi per Scuola</div>
  <div class="tab" data-tab="talents">Talenti</div>
  <div class="tab" data-tab="progression">Progressione</div>
</div>
<div class="main" id="mainContent"></div>
<div class="summary-bar" id="summaryBar"></div>

<script>
const SPELL_UNLOCK_FULL = {1:1,2:1,3:2,4:2,5:3,6:3,7:4,8:4,9:5,10:5,11:6,12:6,13:7,14:7,15:8,16:8,17:9,18:9,19:10,20:10};
const SPELL_UNLOCK_RANGER = {1:1,2:1,3:1,4:1,5:2,6:2,7:2,8:2,9:3,10:3,11:3,12:3,13:4,14:4,15:4,16:4,17:5,18:5,19:5,20:5};
const SPELL_UNLOCK_CAMPIONE = {1:1,2:1,3:1,4:1,5:1,6:1,7:2,8:2,9:2,10:2,11:2,12:2,13:3,14:3,15:3,16:3,17:3,18:3,19:4,20:4};

const CLASSES = {
  'Alchimista': {type:'alchemist',tradition:null},
  'Barbaro': {type:'martial',tradition:null},
  'Bardo': {type:'full_caster',tradition:'Occulto'},
  'Campione': {type:'half_caster',tradition:'Divino',spellUnlock:SPELL_UNLOCK_CAMPIONE},
  'Canaglia': {type:'martial',tradition:null},
  'Chierico': {type:'full_caster',tradition:'Divino'},
  'Druido': {type:'full_caster',tradition:'Primevo'},
  'Guerriero': {type:'martial',tradition:null},
  'Mago': {type:'full_caster',tradition:'Arcano'},
  'Monaco': {type:'martial',tradition:null},
  'Ranger': {type:'half_caster',tradition:'Primevo',spellUnlock:SPELL_UNLOCK_RANGER},
  'Stregone': {type:'full_caster',tradition:'Arcano'},
};

const SCHOOL_NAMES = {
  'amm':'Ammaliamento','abi':'Abiurazione','evo':'Evocazione',
  'inv':'Invocazione','nec':'Necromanzia','tra':'Trasmutazione',
  'div':'Divinazione','ill':'Illusione'
};

let graphData = null;
let nodeById = {};
let nodeByLabel = {};
let edgesFrom = {};
let edgesTo = {};
let currentTab = 'spells';

async function init() {
  graphData = GRAPH_DATA;
  for (const n of graphData.nodes) {
    nodeById[n.id] = n;
    nodeByLabel[n.label] = n;
  }
  for (const e of graphData.links) {
    if (!edgesFrom[e.source]) edgesFrom[e.source] = [];
    edgesFrom[e.source].push(e);
    if (!edgesTo[e.target]) edgesTo[e.target] = [];
    edgesTo[e.target].push(e);
  }

  const sel = document.getElementById('classSelect');
  for (const cls of Object.keys(CLASSES)) {
    const opt = document.createElement('option');
    opt.value = cls; opt.textContent = cls;
    sel.appendChild(opt);
  }
  sel.value = 'Stregone';

  sel.addEventListener('change', render);
  document.getElementById('levelSlider').addEventListener('input', render);
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      currentTab = t.dataset.tab;
      render();
    });
  });
  render();
}

function getSpellLevel(classInfo, charLevel) {
  if (classInfo.type === 'full_caster') return SPELL_UNLOCK_FULL[charLevel];
  if (classInfo.spellUnlock) return classInfo.spellUnlock[charLevel];
  return 0;
}

function getAllSpells(className) {
  const clsNode = nodeByLabel[className];
  if (!clsNode) return {common:[], focus:[]};
  const clsId = clsNode.id;

  const spellLevelIds = {};
  for (const n of graphData.nodes) {
    const m = n.label.match(/^Incantesimo di (\d+)° Livello$/);
    if (m) spellLevelIds[n.id] = parseInt(m[1]);
  }
  const spellSpellLevel = {};
  for (const e of graphData.links) {
    if (e.target in spellLevelIds && e.relation === 'references') {
      spellSpellLevel[e.source] = spellLevelIds[e.target];
    }
  }
  const spellSchool = {};
  for (const e of graphData.links) {
    const tgt = nodeById[e.target];
    if (tgt && tgt.label.startsWith('Scuola: ') && e.relation === 'references') {
      spellSchool[e.source] = tgt.label.replace('Scuola: ', '');
    }
  }
  const spellTradition = {};
  for (const e of graphData.links) {
    const tgt = nodeById[e.target];
    if (tgt && tgt.label.startsWith('Tradizione: ') && e.relation === 'references') {
      spellTradition[e.source] = tgt.label.replace('Tradizione: ', '');
    }
  }

  const focHubId = nodeByLabel['Incantesimi Focalizzati']?.id;
  const focusSpellIds = new Set();
  if (focHubId) {
    for (const e of graphData.links) {
      if (e.target === focHubId && e.relation === 'conceptually_related_to') {
        focusSpellIds.add(e.source);
      }
    }
  }

  const common = [];
  const focus = [];
  const edgesToClass = edgesTo[clsId] || [];
  for (const e of edgesToClass) {
    if (e.relation !== 'references' && e.relation !== 'conceptually_related_to') continue;
    const sid = e.source;
    const spl = spellSpellLevel[sid];
    const isFocus = focusSpellIds.has(sid);
    if (!spl && !isFocus) continue;
    const node = nodeById[sid];
    if (!node) continue;
    const entry = { name: node.label, level: spl || 1, school: spellSchool[sid] || '', tradition: spellTradition[sid] || '', isFocus };
    if (isFocus) {
      focus.push(entry);
    } else if (spl) {
      common.push(entry);
    }
  }
  common.sort((a, b) => a.level - b.level || a.school.localeCompare(b.school) || a.name.localeCompare(b.name));
  focus.sort((a, b) => a.level - b.level || a.school.localeCompare(b.school) || a.name.localeCompare(b.name));
  return {common, focus};
}

function queryTalents(className, charLevel) {
  const clsNode = nodeByLabel[className];
  if (!clsNode) return [];
  const clsId = clsNode.id;
  const talentLevelIds = {};
  for (const n of graphData.nodes) {
    const m = n.label.match(/^Talento di (\d+)° Livello$/);
    if (m) talentLevelIds[n.id] = parseInt(m[1]);
    const m2 = n.label.match(/^Talento di Stirpe di (\d+)° Livello$/);
    if (m2) talentLevelIds[n.id] = parseInt(m2[1]);
  }
  const result = [];
  const seen = new Set();
  const edgesToClass = edgesTo[clsId] || [];
  for (const e of edgesToClass) {
    if (e.relation !== 'conceptually_related_to') continue;
    const sid = e.source;
    if (seen.has(sid)) continue;
    seen.add(sid);
    const outEdges = edgesFrom[sid] || [];
    for (const e2 of outEdges) {
      if (e2.relation === 'has_talent_level' && e2.target in talentLevelIds) {
        const tl = talentLevelIds[e2.target];
        if (tl <= charLevel) {
          const node = nodeById[sid];
          if (node) result.push({ name: node.label, level: tl });
        }
        break;
      }
    }
  }
  result.sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
  return result;
}

function render() {
  const cls = document.getElementById('classSelect').value;
  const lv = parseInt(document.getElementById('levelSlider').value);
  document.getElementById('levelDisplay').textContent = lv;
  const classInfo = CLASSES[cls];
  const maxSpl = getSpellLevel(classInfo, lv);
  const {common, focus} = getAllSpells(cls);
  const commonAtLevel = common.filter(s => s.level <= maxSpl);
  const focusAtLevel = focus.filter(s => s.level <= Math.ceil(lv / 2));
  const talents = queryTalents(cls, lv);

  let html = '';

  if (currentTab === 'spells') {
    html += '<div class="card"><h2><span class="icon" style="background:var(--spell)"></span> Incantesimi per Livello</h2>';
    if (commonAtLevel.length === 0 && focusAtLevel.length === 0) {
      html += `<div class="empty">Nessun incantesimo disponibile per ${cls} al livello ${lv}</div>`;
    } else {
      for (let s = 1; s <= maxSpl; s++) {
        const atLevel = commonAtLevel.filter(x => x.level === s);
        if (atLevel.length === 0) continue;
        html += `<div class="spell-group"><div class="group-header">Incantesimi di ${s}° Livello (${atLevel.length})</div>`;
        for (const sp of atLevel) {
          const tradPill = sp.tradition ? `<span class="pill ${sp.tradition.toLowerCase()}">${sp.tradition}</span>` : '';
          html += `<div class="spell-chip">${sp.name} ${sp.school ? '· '+sp.school : ''} ${tradPill}</div>`;
        }
        html += '</div>';
      }
      if (focusAtLevel.length > 0) {
        html += `<div class="focus-group"><div class="group-header">Incantesimi Focalizzati (${focusAtLevel.length})</div>`;
        for (let s = 1; s <= Math.ceil(lv/2); s++) {
          const atLevel = focusAtLevel.filter(x => x.level === s);
          if (atLevel.length === 0) continue;
          html += `<div style="margin-left:12px;margin-bottom:4px;"><b style="color:var(--focus)">${s}°</b> `;
          for (const sp of atLevel) {
            html += `<span class="spell-chip focus">${sp.name}${sp.school ? ' · '+sp.school : ''}</span> `;
          }
          html += '</div>';
        }
        html += '</div>';
      }
    }
    html += '</div>';

  } else if (currentTab === 'byschool') {
    html += '<div class="card"><h2><span class="icon" style="background:var(--spell)"></span> Incantesimi per Scuola</h2>';
    const allSpells = [...commonAtLevel, ...focusAtLevel];
    if (allSpells.length === 0) {
      html += `<div class="empty">Nessun incantesimo disponibile per ${cls} al livello ${lv}</div>`;
    } else {
      const bySchool = {};
      for (const sp of allSpells) {
        const sch = sp.school || 'Sconosciuta';
        if (!bySchool[sch]) bySchool[sch] = [];
        bySchool[sch].push(sp);
      }
      const schoolOrder = ['Ammaliamento','Abiurazione','Divinazione','Evocazione','Illusione','Invocazione','Necromanzia','Trasmutazione','Sconosciuta'];
      for (const sch of schoolOrder) {
        if (!bySchool[sch]) continue;
        const spells = bySchool[sch];
        html += `<div class="group-header" style="background:rgba(79,195,247,0.1);color:var(--spell);">${sch} (${spells.length})</div>`;
        spells.sort((a,b) => a.level - b.level || a.name.localeCompare(b.name));
        for (let s = 1; s <= maxSpl; s++) {
          const atLevel = spells.filter(x => x.level === s);
          if (atLevel.length === 0) continue;
          html += `<div class="school-header">${s}° Livello</div><div class="spell-grid">`;
          for (const sp of atLevel) {
            const isFocus = focusAtLevel.some(f => f.name === sp.name);
            html += `<span class="spell-chip${isFocus ? ' focus' : ''}">${sp.name}</span>`;
          }
          html += '</div>';
        }
      }
    }
    html += '</div>';

  } else if (currentTab === 'talents') {
    html += '<div class="card"><h2><span class="icon" style="background:var(--talent)"></span> Talenti</h2>';
    if (talents.length === 0) {
      html += `<div class="empty">Nessun talento trovato per ${cls} al livello ${lv}</div>`;
    } else {
      let currentLv = 0;
      for (const t of talents) {
        if (t.level !== currentLv) {
          if (currentLv !== 0) html += '</div>';
          currentLv = t.level;
          html += `<div class="talent-group"><div class="group-header">Talenti ${t.level}° Livello</div><div style="display:flex;flex-wrap:wrap;gap:4px;">`;
        }
        html += `<span class="talent-chip">${t.name}</span>`;
      }
      html += '</div></div>';
    }
    html += '</div>';

  } else if (currentTab === 'progression') {
    if (maxSpl === 0) {
      html += '<div class="card"><h2><span class="icon" style="background:var(--level)"></span> Progressione</h2>';
      html += `<div class="empty">${cls} non è un incantatore e non ha slot incantesimo.</div></div>`;
    } else {
      html += '<div class="card"><h2><span class="icon" style="background:var(--level)"></span> Progressione Incantesimi</h2>';
      html += '<table class="progression-table"><thead><tr><th></th>';
      for (let s = 1; s <= 10; s++) {
        html += `<th>${s}°</th>`;
      }
      html += '</tr></thead><tbody>';
      const unlock = classInfo.type === 'full_caster' ? SPELL_UNLOCK_FULL : (classInfo.spellUnlock || {});
      for (let cl = 1; cl <= 20; cl++) {
        const isActive = cl === lv;
        html += `<tr style="${isActive ? 'background:rgba(233,69,96,0.15)' : ''}"><td style="font-weight:${isActive ? '700' : '400'};color:${isActive ? 'var(--accent)' : 'var(--text)'}">Lv${cl}</td>`;
        for (let s = 1; s <= 10; s++) {
          const maxAtLv = unlock[cl] || 0;
          const avail = s <= maxAtLv;
          html += `<td class="${avail ? 'available' : 'unavailable'}">${avail ? '✓' : '–'}</td>`;
        }
        html += '</tr>';
      }
      html += '</tbody></table></div>';

      const schoolCounts = {};
      for (const sp of commonAtLevel) {
        const sch = sp.school || 'Sconosciuta';
        schoolCounts[sch] = (schoolCounts[sch] || 0) + 1;
      }
      html += '<div class="card"><h2><span class="icon" style="background:var(--spell)"></span> Distribuzione per Scuola</h2>';
      html += '<div class="school-counts">';
      for (const [sch, count] of Object.entries(schoolCounts).sort((a,b) => b[1]-a[1])) {
        html += `<span class="school-badge">${sch}: ${count}</span>`;
      }
      html += '</div></div>';
    }
  }

  document.getElementById('mainContent').innerHTML = html;

  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-stat"><div class="num" style="color:var(--spell)">${commonAtLevel.length}</div><div class="lbl">Incantesimi</div></div>
    <div class="summary-stat"><div class="num" style="color:var(--focus)">${focusAtLevel.length}</div><div class="lbl">Focalizzati</div></div>
    <div class="summary-stat"><div class="num" style="color:var(--talent)">${talents.length}</div><div class="lbl">Talenti</div></div>
    <div class="summary-stat"><div class="num" style="color:var(--level)">${maxSpl > 0 ? maxSpl + '°' : '–'}</div><div class="lbl">Max Incantesimo</div></div>
    <div class="summary-stat"><div class="num" style="color:var(--feature)">${classInfo.tradition || '-'}</div><div class="lbl">Tradizione</div></div>
  `;
}

init();
</script>
</body>
</html>
